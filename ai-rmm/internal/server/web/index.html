<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-RMM Console</title>
<style>
:root { --bg:#f6f7f9; --fg:#1d2330; --muted:#667085; --card:#fff; --line:#e3e6eb; --accent:#2457d6; --ok:#1a7f45; --warn:#b26a00; --bad:#c0362c; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --fg:#e6e9ef; --muted:#98a2b3; --card:#1b2029; --line:#2c3340; --accent:#6d97ff; --ok:#4cc38a; --warn:#f0b54a; --bad:#ff7b72; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; }
nav button { background:none; border:none; color:var(--muted); padding:6px 10px; cursor:pointer; font:inherit; border-radius:6px; }
nav button.on { color:var(--fg); background:var(--bg); font-weight:600; }
main { padding:20px; max-width:1300px; margin:auto; }
table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
tr:last-child td { border-bottom:none; }
.pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); margin:1px; }
.ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); }
button.act { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.danger { color:var(--bad); }
input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
pre { white-space:pre-wrap; word-break:break-word; background:var(--bg); padding:8px; border-radius:6px; max-height:360px; overflow:auto; margin:4px 0; font-size:12px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
#login { max-width:420px; margin:80px auto; }
.wrap { overflow-x:auto; }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h2>AI-RMM Console</h2>
  <p class="muted">Paste an <b>admin</b> API key. It is kept in this browser tab only.</p>
  <div class="row"><input id="key" type="password" placeholder="rk_..." style="flex:1"><button class="act primary" onclick="login()">Sign in</button></div>
  <div id="loginErr" class="bad"></div>
</div>
<div id="app" hidden>
<header>
  <h1>AI-RMM</h1>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <span id="who" class="muted"></span>
  <button class="act" onclick="logout()">Sign out</button>
</header>
<main id="main"></main>
</div>
<script>
const tabs = ["Approvals","Events","Agents","Network","Schedules","Jobs","Tools","Credentials","Enroll","Audit"];
let tab = "Approvals", key = sessionStorage.getItem("rmmkey") || "";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ts = u => u ? new Date(u*1000).toLocaleString() : "";
async function api(path, opts={}) {
  const r = await fetch("/api/v1/"+path, {...opts, headers:{"Authorization":"Bearer "+key, "Content-Type":"application/json"}});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
async function login() {
  key = $("#key").value.trim();
  try { const w = await api("whoami"); sessionStorage.setItem("rmmkey", key); start(w); }
  catch(e) { $("#loginErr").textContent = e.message; }
}
function logout() { sessionStorage.removeItem("rmmkey"); location.reload(); }
function start(w) {
  $("#login").hidden = true; $("#app").hidden = false;
  $("#who").textContent = w.name + " (" + w.role + ") · server " + w.server_version;
  $("#nav").innerHTML = tabs.map(t => `<button data-t="${t}">${t}</button>`).join("");
  $("#nav").onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };
  render(); setInterval(() => { if (["Approvals","Agents","Network","Events"].includes(tab)) render(); }, 15000);
}
const statusClass = s => ({succeeded:"ok",queued:"muted",dispatched:"muted",pending_approval:"warn",failed:"bad",timeout:"bad",rejected:"bad",denied:"bad",expired:"muted"}[s]||"");
let render = async function() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t===tab));
  const m = $("#main");
  try { m.innerHTML = await views[tab](); } catch(e) { m.innerHTML = `<div class="card bad">${esc(e.message)}</div>`; }
}
const views = {
  async Approvals() {
    const jobs = await api("approvals");
    const scheds = (await api("schedules")).filter(s => !s.approved);
    const schedHtml = scheds.map(s => `<div class="card"><div class="row"><b>Schedule: ${esc(s.name)}</b><span class="pill warn">recurring</span>
        <span class="muted">by ${esc(s.created_by)}</span></div>
        <div><b>${esc(s.tool)}</b> on ${(s.targets||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")} at ${esc(s.time)} ${(s.days||[]).length ? esc(s.days.join(",")) : "daily"} · window ${s.window_minutes} min</div>
        <div><b>Reason:</b> ${esc(s.reason)}</div><pre>${esc(JSON.stringify(s.params,null,1))}</pre>
        <div class="muted">Approving lets every future run of this exact schedule proceed without further approval.</div>
        <div class="row" style="margin-top:8px"><button class="act primary" onclick="schedAct('${s.id}','approve')">Approve schedule</button>
        <button class="act danger" onclick="schedDel('${s.id}')">Delete</button></div></div>`).join("");
    if (!jobs.length) return schedHtml || `<div class="card muted">Nothing is waiting for approval.</div>`;
    const batches = {};
    jobs.forEach(j => (batches[j.batch_id] ||= []).push(j));
    return Object.entries(batches).map(([b, js]) => { const j = js[0]; return `
      <div class="card">
        <div class="row"><b>${esc(j.tool)}</b><span class="pill warn">${esc(j.risk)}</span>
          <span class="muted">requested by ${esc(j.requested_by)} · ${ts(j.created_at)} · ${js.length} machine(s)</span></div>
        <div><b>Reason:</b> ${esc(j.reason)}</div>
        <div class="muted">Why approval: ${esc(j.approval_reason)}</div>
        <div><b>Targets:</b> ${js.map(x=>`<span class="pill">${esc(x.hostname)}</span>`).join("")}</div>
        <div><b>Params:</b><pre>${esc(JSON.stringify(j.params, null, 1))}</pre></div>
        <details><summary>Script that will run</summary><pre>${esc(j.script)}</pre></details>
        <div class="row" style="margin-top:8px">
          <button class="act primary" onclick="decide('${b}',true)">Approve all ${js.length}</button>
          <button class="act danger" onclick="decide('${b}',false)">Deny</button>
        </div>
      </div>`; }).join("") + schedHtml;
  },
  async Events() {
    const ev = await api("events?limit=200");
    const cls = {critical:"bad",warning:"warn",info:"ok"};
    return `<div class="wrap"><table><tr><th>When</th><th>Type</th><th>Subject</th><th>Event</th></tr>` +
      ev.map(e => `<tr><td>${ts(e.time)}</td><td class="${cls[e.severity]||""}">${esc(e.type)}</td><td>${esc(e.subject)}</td><td>${esc(e.text)}</td></tr>`).join("") + `</table></div>`;
  },
  async Network() {
    const ds = await api("devices");
    const cls = {up:"ok",down:"bad",stale:"warn",unknown:"muted"};
    if (!ds.length) return `<div class="card muted">No network devices monitored yet. Ask the AI to run <code>network_scan</code> and add devices, or POST to /api/v1/devices.</div>`;
    return `<div class="wrap"><table><tr><th>Device</th><th>State</th><th>Address</th><th>Kind</th><th>Latency</th><th>SNMP</th><th>Last check</th><th></th></tr>` +
      ds.map(d => { const st = d.status||{}; const sn = st.snmp||{}; return `<tr>
        <td><b>${esc(d.name)}</b><div class="muted">${esc(d.notes)}</div></td>
        <td class="${cls[st.state]||""}">${esc(st.state)}<div class="muted">${esc(st.error)}</div></td>
        <td>${esc(d.address)}</td><td>${esc(d.kind)}</td>
        <td>${st.latency_ms ? st.latency_ms.toFixed(1)+" ms" : ""}</td>
        <td>${sn.ok ? esc(sn.sys_name)+`<div class="muted">${esc((sn.sys_descr||"").slice(0,80))}</div>` : esc(sn.error||"")}</td>
        <td>${ts(st.last_check)}</td>
        <td><button class="act danger" onclick="devDel('${d.id}')">Remove</button></td></tr>`; }).join("") + `</table></div>`;
  },
  async Schedules() {
    const ss = await api("schedules");
    if (!ss.length) return `<div class="card muted">No schedules. The AI can propose them (e.g. weekly patch windows) with save_schedule; they appear under Approvals.</div>`;
    return `<div class="wrap"><table><tr><th>Name</th><th>Tool / targets</th><th>When</th><th>Next run</th><th>State</th><th>Last run</th><th></th></tr>` +
      ss.map(s => `<tr><td><b>${esc(s.name)}</b><div class="muted">${esc(s.reason)}</div></td>
        <td>${esc(s.tool)}<div>${(s.targets||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div></td>
        <td>${esc(s.time)} ${(s.days||[]).length ? esc(s.days.join(",")) : "daily"}<div class="muted">window ${s.window_minutes} min</div></td>
        <td>${ts(s.next_run)}</td>
        <td>${s.approved ? `<span class="ok">approved</span>` : `<span class="warn">needs approval</span>`} · ${s.enabled ? "enabled" : "paused"}</td>
        <td>${ts(s.last_run)}</td>
        <td>${s.approved ? "" : `<button class="act primary" onclick="schedAct('${s.id}','approve')">Approve</button>`}
            <button class="act" onclick="schedAct('${s.id}','${s.enabled?"disable":"enable"}')">${s.enabled?"Pause":"Resume"}</button>
            <button class="act danger" onclick="schedDel('${s.id}')">Delete</button></td></tr>`).join("") + `</table></div>`;
  },
  async Credentials() {
    const cs = await api("credentials");
    return `<div class="card"><h3>Credential vault</h3><p class="muted">Encrypted at rest. The AI can use these by name (deploy_agent, network_scan, SNMP monitoring) but can never read them.</p>
      <div class="row"><input id="crName" placeholder="name (e.g. domain-deploy)"><select id="crKind" onchange="crFields()"><option>windows</option><option>snmp</option><option>generic</option></select>
      <input id="crDesc" placeholder="description" style="flex:1"></div>
      <div class="row" id="crFields"></div>
      <button class="act primary" onclick="crSave()">Save credential</button></div>` +
      `<div class="wrap"><table><tr><th>Name</th><th>Kind</th><th>Username</th><th>Description</th><th>Created</th><th></th></tr>` +
      cs.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.kind)}</td><td>${esc(c.username)}</td><td>${esc(c.description)}</td><td>${ts(c.created_at)}</td>
        <td><button class="act danger" onclick="crDel('${esc(c.name)}')">Delete</button></td></tr>`).join("") + `</table></div>`;
  },
  async Agents() {
    const as = await api("agents");
    return `<div class="wrap"><table><tr><th>Host</th><th>State</th><th>OS</th><th>IPs</th><th>Groups</th><th>Auto-approve</th><th>Agent</th><th>Notes</th><th></th></tr>` +
      as.map(a => `<tr>
        <td><b>${esc(a.hostname)}</b><div class="muted">${esc(a.id)}</div></td>
        <td class="${a.online?"ok":"bad"}">${a.online?"online":"offline"}<div class="muted">${esc(a.last_seen)}</div></td>
        <td>${esc(a.facts.os_name)}<div class="muted">${esc(a.facts.os_version)} · ${esc(a.facts.product_type)}</div></td>
        <td>${(a.facts.ips||[]).map(esc).join("<br>")}</td>
        <td>${(a.groups||[]).map(g=>`<span class="pill">${esc(g)}</span>`).join("")}</td>
        <td>${esc(a.effective_policy.auto_approve_max_risk)}</td>
        <td>${esc(a.version)} ${esc(a.variant)}</td>
        <td style="max-width:260px">${esc(a.notes)}</td>
        <td><button class="act" onclick="editGroups('${a.id}','${esc((a.groups||[]).join(","))}')">Groups</button>
            <button class="act ${a.disabled?"":"danger"}" onclick="toggle('${a.id}',${!a.disabled})">${a.disabled?"Enable":"Disable"}</button></td>
      </tr>`).join("") + `</table></div>`;
  },
  async Jobs() {
    const js = await api("jobs?limit=100");
    return `<div class="wrap"><table><tr><th>When</th><th>Host</th><th>Tool</th><th>Status</th><th>By / reason</th><th>Output</th></tr>` +
      js.map(j => `<tr><td>${ts(j.created_at)}</td><td>${esc(j.hostname)}</td><td>${esc(j.tool)}</td>
        <td class="${statusClass(j.status)}">${esc(j.status)}</td>
        <td><div>${esc(j.requested_by)}</div><div class="muted">${esc(j.reason)}</div></td>
        <td>${j.result ? `<details><summary>exit ${j.result.exit_code}</summary><pre>${esc(j.result.data ? JSON.stringify(j.result.data,null,1) : j.result.stdout)}</pre>${j.result.stderr?`<pre class="bad">${esc(j.result.stderr)}</pre>`:""}</details>` : ""}</td></tr>`).join("") + `</table></div>`;
  },
  async Tools() {
    const ts_ = await api("tools");
    return `<div class="wrap"><table><tr><th>Tool</th><th>Risk</th><th>Status</th><th>Source</th><th>Description</th><th></th></tr>` +
      ts_.map(t => `<tr><td><b>${esc(t.name)}</b> <span class="muted">v${t.version}</span></td>
        <td>${esc(t.risk)}</td><td class="${t.status==="draft"?"warn":""}">${esc(t.status)}</td><td>${esc(t.source)}<div class="muted">${esc(t.author)}</div></td>
        <td>${esc(t.description)}<details><summary>source</summary><pre>${esc(t.script)}</pre><pre>${esc(JSON.stringify(t.params,null,1))}</pre></details></td>
        <td>${t.source==="custom" ? (t.status==="draft"
          ? `<button class="act primary" onclick="toolAct('${t.name}','publish')">Publish</button>`
          : `<button class="act" onclick="toolAct('${t.name}','unpublish')">Unpublish</button>`) +
          ` <button class="act danger" onclick="toolDel('${t.name}')">Delete</button>` : ""}</td></tr>`).join("") + `</table></div>`;
  },
  async Enroll() {
    return `<div class="card"><h3>Create enrollment token</h3>
      <p class="muted">Agents present this once at install time. Groups set here are applied to every machine that enrolls with it (e.g. <code>ot</code>, <code>site-plant1</code>).</p>
      <div class="row"><input id="etName" placeholder="name (e.g. plant1-floor)"><input id="etGroups" placeholder="groups, comma separated">
      <input id="etTTL" type="number" value="168" style="width:90px" title="TTL hours"> h
      <input id="etMax" type="number" value="0" style="width:90px" title="max uses (0 = unlimited)"> uses
      <button class="act primary" onclick="mkToken()">Create</button></div><pre id="etOut" hidden></pre></div>`;
  },
  async Audit() {
    const a = await api("audit?n=300");
    return `<pre style="max-height:none">${esc(a.reverse().map(x => JSON.stringify(x)).join("\n"))}</pre>`;
  },
};
async function decide(batch, approve) {
  const note = approve ? "" : (prompt("Reason for denying?") || "");
  try { await api("approvals", {method:"POST", body:JSON.stringify({batch_id:batch, approve, note})}); } catch(e) { alert(e.message); }
  render();
}
async function editGroups(id, cur) {
  const v = prompt("Groups (comma separated). Groups drive approval policy.", cur); if (v === null) return;
  try { await api("agents/"+id, {method:"PATCH", body:JSON.stringify({groups:v.split(",").map(s=>s.trim()).filter(Boolean)})}); } catch(e) { alert(e.message); }
  render();
}
async function toggle(id, disabled) {
  if (disabled && !confirm("Disable this agent? It will stop receiving jobs.")) return;
  try { await api("agents/"+id, {method:"PATCH", body:JSON.stringify({disabled})}); } catch(e) { alert(e.message); }
  render();
}
async function toolAct(n, a) {
  if (a==="publish" && !confirm("Publish "+n+"? Have you read its source? Once published, it runs under normal risk policy.")) return;
  try { await api("tools/"+n+"/"+a, {method:"POST"}); } catch(e) { alert(e.message); } render();
}
async function toolDel(n) { if (!confirm("Delete tool "+n+"?")) return; try { await api("tools/"+n, {method:"DELETE"}); } catch(e) { alert(e.message); } render(); }
async function mkToken() {
  try {
    const r = await api("enroll-tokens", {method:"POST", body:JSON.stringify({name:$("#etName").value, groups:$("#etGroups").value.split(",").map(s=>s.trim()).filter(Boolean), ttl_hours:+$("#etTTL").value, max_uses:+$("#etMax").value})});
    const o = $("#etOut"); o.hidden = false; o.textContent = "Token (shown once): " + r.token;
  } catch(e) { alert(e.message); }
}
async function schedAct(id, a) { try { await api("schedules/"+id+"/"+a, {method:"POST"}); } catch(e) { alert(e.message); } render(); }
async function schedDel(id) { if (!confirm("Delete this schedule?")) return; try { await api("schedules/"+id, {method:"DELETE"}); } catch(e) { alert(e.message); } render(); }
async function devDel(id) { if (!confirm("Stop monitoring this device?")) return; try { await api("devices/"+id, {method:"DELETE"}); } catch(e) { alert(e.message); } render(); }
async function crDel(n) { if (!confirm("Delete credential "+n+"? Tools and devices using it will fail.")) return; try { await api("credentials/"+n, {method:"DELETE"}); } catch(e) { alert(e.message); } render(); }
const crSpec = { windows: ["username","password"], snmp: ["version","community","username","auth_proto","auth_pass","priv_proto","priv_pass"], generic: ["key1","value1"] };
function crFields() {
  const k = $("#crKind").value;
  $("#crFields").innerHTML = crSpec[k].map(f => `<input data-f="${f}" placeholder="${f}${f==="version"?" (2c or 3)":""}" type="${/pass|community|value/.test(f)?"password":"text"}">`).join("");
}
async function crSave() {
  const k = $("#crKind").value, sec = {};
  document.querySelectorAll("#crFields input").forEach(i => { if (i.value) sec[i.dataset.f] = i.value; });
  if (k === "generic" && sec.key1) { sec[sec.key1] = sec.value1 || ""; delete sec.key1; delete sec.value1; }
  try { await api("credentials/"+encodeURIComponent($("#crName").value.trim()), {method:"PUT", body:JSON.stringify({kind:k, description:$("#crDesc").value, secrets:sec})}); render(); }
  catch(e) { alert(e.message); }
}
const _render = render;
render = async function() { await _render(); if (tab === "Credentials") crFields(); };
(async () => { if (key) { try { start(await api("whoami")); return; } catch(e) {} } $("#login").hidden = false; })();
</script>
</body>
</html>
